# Five Arista EOS devices in a hub and spoke configuration
name: lab1

topology:
  nodes:
    ceos1:
      kind: arista_ceos
      image: ceos:4.32.0F
    ceos2:
      kind: arista_ceos
      image: ceos:4.32.0F
    ceos3:
      kind: arista_ceos
      image: ceos:4.32.0F
    ceos4:
      kind: arista_ceos
      image: ceos:4.32.0F
    ceos5:
      kind: arista_ceos
      image: ceos:4.32.0F

  links:
    - endpoints: ["ceos1:eth2", "ceos2:eth1"]
    - endpoints: ["ceos1:eth3", "ceos3:eth1"]
    - endpoints: ["ceos1:eth4", "ceos4:eth1"]
    - endpoints: ["ceos1:eth5", "ceos5:eth1"]

